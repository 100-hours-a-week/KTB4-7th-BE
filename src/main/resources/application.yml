spring:
  application:
    name: memme
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 51MB
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  send-default-pii: false

password-reset:
  url: ${PASSWORD_RESET_URL}

app:
  asos-import:
    enabled: ${ASOS_OBSERVATION_IMPORT_ENABLED:false}
  seoul-district-import:
    enabled: ${SEOUL_DISTRICT_IMPORT_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    trust-x-forwarded-for: ${TRUST_X_FORWARDED_FOR:false}
  password-reset:
    rate-limit:
      hash-key: ${PASSWORD_RESET_RATE_LIMIT_HASH_KEY:}
  login:
    rate-limit:
      hash-key: ${LOGIN_RATE_LIMIT_HASH_KEY:}
  qa-account:
    enabled: ${QA_ACCOUNT_ENABLED:false}
    email: ${QA_ACCOUNT_EMAIL:}
    password: ${QA_ACCOUNT_PASSWORD:}
    phone: ${QA_ACCOUNT_PHONE:}
    business-registration-no: ${QA_ACCOUNT_BUSINESS_REGISTRATION_NO:}
    store-name: ${QA_ACCOUNT_STORE_NAME:}
    postal-code: ${QA_ACCOUNT_POSTAL_CODE:}
    address: ${QA_ACCOUNT_ADDRESS:}
    address-detail: ${QA_ACCOUNT_ADDRESS_DETAIL:}
  sales:
    upload:
      queue-capacity: ${SALES_UPLOAD_QUEUE_CAPACITY:10}
    storage:
      type: ${SALES_STORAGE_TYPE:local}
      s3:
        bucket: ${SALES_STORAGE_S3_BUCKET:}
        region: ${SALES_STORAGE_S3_REGION:ap-northeast-2}
        endpoint: ${SALES_STORAGE_S3_ENDPOINT:}
        path-style-access: ${SALES_STORAGE_S3_PATH_STYLE_ACCESS:false}
  menu:
    storage:
      type: ${MENU_STORAGE_TYPE:local}
      local-directory: ${MENU_STORAGE_LOCAL_DIRECTORY:${java.io.tmpdir}/memme-menu-images}
      s3:
        bucket: ${MENU_STORAGE_S3_BUCKET:}
        region: ${MENU_STORAGE_S3_REGION:ap-northeast-2}
        endpoint: ${MENU_STORAGE_S3_ENDPOINT:}
        path-style-access: ${MENU_STORAGE_S3_PATH_STYLE_ACCESS:false}
