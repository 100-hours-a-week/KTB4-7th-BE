spring:
  application:
    name: memme
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

password-reset:
  url: ${PASSWORD_RESET_URL}

app:
  sales:
    storage:
      type: ${SALES_STORAGE_TYPE:local}
      s3:
        bucket: ${SALES_STORAGE_S3_BUCKET:}
        region: ${SALES_STORAGE_S3_REGION:ap-northeast-2}
        endpoint: ${SALES_STORAGE_S3_ENDPOINT:}
        path-style-access: ${SALES_STORAGE_S3_PATH_STYLE_ACCESS:false}
