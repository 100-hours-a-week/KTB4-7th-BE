spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    url: jdbc:h2:mem:memme;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  mail:
    host: localhost
    port: 2525
    username: test@memme.local
    password: test-app-password
  jpa:
    hibernate:
      ddl-auto: create-drop

JUSO_CONFM_KEY: test-confirmation-key
NTS_SERVICE_KEY: test-service-key

sentry:
  dsn:
  environment: test
  send-default-pii: false

password-reset:
  url: http://localhost:5173/password-reset

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  password-reset:
    rate-limit:
      hash-key: test-password-reset-rate-limit-key
  login:
    rate-limit:
      hash-key: test-login-rate-limit-key
